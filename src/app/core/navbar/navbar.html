<header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
  <a routerLink="/" class="flex items-center gap-2">
    <mat-icon class="text-blue-600">change_history</mat-icon>
    <span class="text-lg font-semibold tracking-tight text-slate-900">Pythogorean</span>
  </a>

  @if (session(); as user) {
    <div class="flex items-center gap-3">
      <a
        routerLink="/classes"
        routerLinkActive="bg-blue-50 text-blue-700"
        class="rounded-lg px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
      >
        My classes
      </a>
      <span class="hidden text-sm text-slate-500 sm:inline">{{ user.email }}</span>
      <button
        type="button"
        (click)="logout()"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
      >
        Sign out
      </button>
    </div>
  } @else {
    <div class="flex items-center gap-2">
      <a
        routerLink="/login"
        class="rounded-lg px-4 py-2 text-sm font-medium text-blue-700 transition hover:bg-blue-50"
      >
        Login
      </a>
      <a
        routerLink="/register"
        class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-700"
      >
        Register
      </a>
    </div>
  }
</header>
